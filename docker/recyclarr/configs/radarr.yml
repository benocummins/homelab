# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
radarr:
  radarr-main:
    base_url: !env_var RADARR_URL
    api_key: !env_var RADARR_API_KEY

    # One set of file-size limits per Radarr, so only one type here.
    quality_definition:
      type: movie

    quality_profiles:
      # 1 . Main profile, straight from TRaSH
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

      # 2. Anime: TRaSH scoring, Remux removed
      - trash_id: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
        name: Anime 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p

      # 3. Old movies that only exist in SD. Accepts SD, upgrades if better appears.
      - name: SD or better
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: DVD
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: SDTV
        # Only the two groups with decisions in them. Everything else syncs by default.
    custom_formats:
      # Penalize multi-language releases on the main profile only.
      # Anime often only comes as MULTi/dual audio, so it is left alone.
      - trash_ids:
          - 4b900e171accbfb172729b63323ea8ca # MULTi
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            score: -100

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # Golden Rule HD (x265)
          # To allow x265 releases, uncomment both lines:
          # exclude:
          #   - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
          # select:
          #   - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)