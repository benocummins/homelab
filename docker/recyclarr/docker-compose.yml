services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8
    container_name: recyclarr
    user: 1000:1000
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      - /opt/docker/recyclarr/config:/config
    configs:
      - source: recyclarr_sonarr
        target: /config/configs/sonarr.yml
      - source: recyclarr_radarr
        target: /config/configs/radarr.yml
    networks:
      lan:
        ipv4_address: ${RECYCLARR_PRIVATE_IP}
        mac_address: ${RECYCLARR_MAC}

configs:
  recyclarr_sonarr:
    file: ./configs/sonarr.yml
  recyclarr_radaar:
    file: ./configs/radarr.yml

networks:
  lan:
    external: true
