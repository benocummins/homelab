name: crafty
# Web service running Crafty Controller for Self-Hosted Minecraft Servers
services:
  crafty:
    container_name: crafty
    image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${CRAFTY_MEMORY_LIMIT}
    environment:
      - TZ=America/New_York
    # Ports are not needed since we are on macvlan
    # I left them here for reference
    # ports:
    #   - "8443:8443" # HTTPS
    #   - "8123:8123" # DYNMAP
    #   - "19132:19132/udp" # BEDROCK
    #   - "25500-25600:25500-25600" # MC SERV PORT RANGE
    volumes:
      - /mnt/fx_backup/crafty:/crafty/backups
      - /opt/docker/crafty/logs:/crafty/logs
      - /opt/docker/crafty/servers:/crafty/servers
      - /opt/docker/crafty/config:/crafty/app/config
      - /opt/docker/crafty/import:/crafty/import
    networks:
      lan:
        ipv4_address: ${CRAFTY_PRIVATE_IP}
        mac_address: ${CRAFTY_MAC}

networks:
  lan:
    external: true
