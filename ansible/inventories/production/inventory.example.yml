# Example inventory. Copy to inventory.yml and fill in your own values.
# Run from the repo root: ansible all -m ping

all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/ansible_homelab

  # Define each host once, with its address
  hosts:
    host01:
      ansible_host: 192.168.1.100
    host02:
      ansible_host: 192.168.1.101

  # Groups only list host names
  children:
    docker_hosts:
      hosts:
        host01:
        host02:
    media_hosts:
      hosts:
        host01:
    k3s:
      hosts:
        host02:
    mgmt_hosts:
      hosts:
        host02:
